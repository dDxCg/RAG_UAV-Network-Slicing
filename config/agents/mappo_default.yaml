#   hidden_dim: 128              # Smaller networks


# ============================================
# MONITORING GUIDELINES
# ============================================

# Healthy Training Indicators:
# - Clip fraction: 10-30% (if too high >50%, decrease clip_epsilon)
# - Approx KL: < 0.02 (if higher, policy changing too fast)
# - Entropy: Slowly decreasing but not collapsing to 0
# - Value loss: Steadily decreasing
# - Policy loss: May fluctuate but trending down
# - Explained variance: > 0.7 is good

# Warning Signs:
# - Clip fraction > 50%: Policy changing too aggressively
# - Approx KL > 0.05: Enable target_kl early stopping
# - Entropy → 0: Policy becoming deterministic, increase entropy_coef
# - Value loss not decreasing: Increase critic_lr or value_loss_coef
# - Rewards not improving: Check reward scaling, increase n_steps


# ============================================
# COMPARISON WITH MADDPG
