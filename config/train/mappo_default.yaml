#         └── ...


# ============================================
# RESUMING TRAINING
# ============================================

# To resume from a checkpoint:
# 1. In train_mappo_optimized_periodic.py, set:
#    checkpoint_file = "saved_models/mappo/model1/checkpoints/checkpoint_step_50000.pth"
# 
# 2. Adjust total_training_steps if needed
# 
# 3. Run training as normal
# 
# Note: Training will continue from the checkpoint
# Metrics will be appended to existing CSV files