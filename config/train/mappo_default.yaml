#             update_policy_and_critic()
#     buffer.clear()                     # Discard old data
# 
# Key: ON-POLICY, trains on fresh data only


# ============================================
# EXPECTED TRAINING TIME
# ============================================

# With default settings (1M steps, n_steps=2048):
# - Number of training updates: ~488 (1M / 2048)
# - Updates per epoch: 488 * 10 = 4,880 gradient steps
# 
# Estimated time (with visualization OFF):
# - GPU (RTX 3090): ~3-5 hours
# - GPU (RTX 2080): ~5-8 hours
# - CPU only: ~20-30 hours (not recommended)
# 
# With visualization ON: Add 30-50% overhead

# Note: MAPPO is typically 2-3x slower than MADDPG in wall-clock time
# But provides more stable training and better final performance


