# config/train/mappo_default.yaml
# MAPPO Training Configuration for UAV Network Slicing
# Adapted from MADDPG training configuration

# ============================================
# Training Duration
# ============================================
total_training_steps: 102400    # Total number of environment steps
                                 # MAPPO typically needs more steps than MADDPG
                                 # Recommended: 1M-2M for production
                                 # Quick test: 100K-200K

# ============================================
# Logging and Checkpointing
# ============================================
log_interval: 100                # Print training stats every N steps
                                 # Lower = more verbose logging
                                 # Typical: 50-200

save_interval: 10000             # Save model checkpoint every N steps
                                 # Balance between safety and disk space
                                 # Typical: 5K-20K

evaluation_interval: 5000        # Evaluate policy every N steps
                                 # Run deterministic episodes to measure performance
                                 # Typical: 2K-10K

plot_interval: 10000             # Generate training plots every N steps
                                 # Can be expensive for large datasets
                                 # Typical: 5K-20K

# ============================================
# Directories
# ============================================
save_dir: "./saved_models/mappo"  # Root directory for saving models
                                  # Will create subdirectories: model1, model2, ...
                                  # Each run gets a new model folder

# ============================================
# Configuration Files
# ============================================
# These are set automatically by the training script:
# env_config_path: "config/environment/default.yaml"
# train_config_path: "config/train/mappo_default.yaml"

# ============================================
# MAPPO-SPECIFIC PARAMETERS
# ============================================

# Rollout Collection
n_steps: 2048                    # Number of steps to collect before each training update
                                 # This is the KEY difference from MADDPG
                                 # Higher = more stable, slower wall-clock time
                                 # Must be >= batch_size (defined in agent config)
                                 # Recommended values:
                                 #   - Fast iteration: 1024
                                 #   - Balanced: 2048
                                 #   - Sample efficient: 4096

# Training Trigger
min_buffer_size: 64              # Minimum rollout buffer size before training
                                 # Safety check (should always have >= n_steps)
                                 # Set to batch_size from agent config
                                 # MUCH smaller than MADDPG's min_buffer_size (1000)


# ============================================
# REMOVED MADDPG PARAMETERS
# ============================================

# The following MADDPG parameters are NOT used in MAPPO:

# train_frequency: 10            # ❌ REMOVED
#                                # MAPPO trains after every rollout collection
#                                # Not every N steps like MADDPG

# train_iterations: 10           # ❌ REMOVED
#                                # MAPPO controls this via n_epochs in agent config
#                                # MADDPG did multiple gradient updates per call

# exploration_noise_update_interval: 100  # ❌ REMOVED
#                                # MAPPO uses natural exploration via entropy
#                                # No manual noise schedule needed

# greedy_experience_gathering_steps: 5000  # ❌ REMOVED
#                                # MAPPO doesn't need greedy baseline
#                                # No BC regularization

# bc_regularization:             # ❌ REMOVED
#   initial_weight: 0.8          # MAPPO is pure RL
#   final_weight: 0.2            # No behavior cloning component
#   transition_steps: 500000
#   schedule_type: 'cosine'


