# ============================================
# TRAINING WORKFLOW
# ============================================

# Typical MAPPO training workflow:
# 
# 1. Collect n_steps (e.g., 2048) of experience
#    - For each step:
#      * Get stochastic actions from policy
#      * Store (state, action, log_prob, reward, value)
#      * Step environment
#      * Reset if done
# 
# 2. Compute advantages using GAE
#    - Uses stored values and rewards
#    - Requires value of next state for bootstrapping
# 
# 3. Train for n_epochs (e.g., 10) on collected data
#    - For each epoch:
#      * Shuffle data
#      * Split into mini-batches
#      * Update policy and value function
#      * Monitor KL divergence
# 
# 4. Clear buffer and repeat
#    - On-policy: must discard old data
#    - Cannot reuse like MADDPG


# ============================================
# PERFORMANCE TUNING
# ============================================

# To improve SAMPLE EFFICIENCY (fewer environment steps):
# - Increase n_steps (2048 → 4096)
# - Increase n_epochs in agent config (10 → 15)
# - Increase batch_size in agent config (64 → 128)
# Note: This will increase wall-clock time per update

# To improve WALL-CLOCK TIME (faster training):
# - Decrease n_steps (2048 → 1024)
# - Decrease n_epochs in agent config (10 → 5)
# - Decrease batch_size in agent config (64 → 32)
# Note: This will decrease sample efficiency

# To improve STABILITY:
# - Increase n_steps (2048 → 4096)
# - Decrease clip_epsilon in agent config (0.2 → 0.15)
# - Increase batch_size in agent config (64 → 128)

# To improve EXPLORATION:
# - Increase entropy_coef in agent config (0.01 → 0.05)
# - Start training with higher entropy, decay later


# ============================================
# MONITORING CHECKLIST
# ============================================

# During training, monitor these metrics:
# 
# ✓ Reward: Should trend upward
# ✓ Policy Loss: May fluctuate, watch for trends
# ✓ Value Loss: Should decrease over time
# ✓ Entropy: Should decrease slowly (not collapse)
# ✓ Approx KL: Should stay < 0.02
# ✓ Clip Fraction: Healthy range 10-30%
# ✓ Explained Variance: Higher is better (>0.7 is good)
# 
# Warning signs:
# ⚠️  Reward not improving: Check reward scaling, increase n_steps
# ⚠️  High KL (>0.05): Decrease learning rate or enable target_kl
# ⚠️  Clip fraction >50%: Policy changing too fast, decrease clip_epsilon
# ⚠️  Entropy →0: Policy too deterministic, increase entropy_coef
# ⚠️  Value loss not decreasing: Increase critic_lr


